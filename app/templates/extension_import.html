<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>공지 저장 - 알려줌</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; padding: 36px 16px; color: #20362b; background: #f5f4ef; font-family: "Malgun Gothic", "Noto Sans KR", sans-serif; }
      main { width: min(760px, 100%); margin: auto; padding: 30px; border: 1px solid #e1e5df; border-radius: 14px; background: white; }
      .eyebrow { margin: 0 0 7px; color: #dc7047; font-weight: 700; font-size: 13px; }
      h1 { margin: 0 0 18px; font-size: 25px; }
      #status { color: #68766e; line-height: 1.6; }
      #preview[hidden], #save[hidden] { display: none; }
      #title { margin: 18px 0 8px; font-size: 20px; line-height: 1.5; }
      #meta { color: #718078; font-size: 13px; }
      #content { max-height: 360px; overflow: auto; margin: 16px 0; border: 1px solid #e7ebe7; border-radius: 8px; padding: 14px; background: #fbfcfa; white-space: pre-wrap; line-height: 1.7; font-size: 14px; }
      #attachments { padding-left: 20px; color: #486454; }
      button { border: 0; border-radius: 8px; padding: 12px 18px; color: #fff; background: #185438; font-size: 15px; font-weight: 700; cursor: pointer; }
      button:disabled { opacity: .6; cursor: wait; }
      a { color: #185438; }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">알려줌 · 새 공지</p>
      <h1>공지 내용을 확인하고 저장하세요</h1>
      <p id="status" role="status">확장 프로그램에서 읽은 상세 공지를 기다리고 있습니다.</p>
      <section id="preview" hidden>
        <h2 id="title"></h2>
        <p id="meta"></p>
        <pre id="content"></pre>
        <h3>첨부파일</h3>
        <ul id="attachments"></ul>
        <button id="save" hidden>공지 DB에 저장</button>
      </section>
    </main>
    <script src="/static/js/extension-import.js"></script>
  </body>
</html>
