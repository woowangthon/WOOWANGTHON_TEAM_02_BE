<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>새 공지 확인</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <p class="eyebrow">충북대학교 공지</p>
      <h1>새 공지 확인</h1>
      <p class="description">누르면 홈페이지를 열어 현재 목록을 DB와 비교합니다.</p>
      <button data-department="computer">컴퓨터공학과 확인</button>
      <button data-department="electrical">전기공학부 확인</button>
      <label for="apiBase">알려줌 주소</label>
      <div class="api-row">
        <input id="apiBase" type="url" value="http://localhost:8000" spellcheck="false">
        <button id="saveApi" class="secondary">저장</button>
      </div>
      <p id="status" role="status"></p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
