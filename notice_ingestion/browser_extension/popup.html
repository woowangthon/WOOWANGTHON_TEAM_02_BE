<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>새 공지 확인</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <p class="eyebrow">충북대학교 공지</p>
      <h1>새 공지 확인</h1>
      <p class="description">누르면 학과 홈페이지의 공지 목록을 확인합니다. 아래 주소에서 로컬 또는 공개 앱을 선택하세요.</p>
      <button data-department="computer">컴퓨터공학과 확인</button>
      <button data-department="electrical">전기공학부 확인</button>
      <label for="apiBase">알려줌 주소</label>
      <div class="api-row">
        <input id="apiBase" type="url" value="http://localhost:8000" placeholder="https://woowangthonteam02be-production.up.railway.app" spellcheck="false">
        <button id="saveApi" class="secondary">저장</button>
      </div>
      <p id="status" role="status"></p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
