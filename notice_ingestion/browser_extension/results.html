<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>새 공지 확인 결과</title>
    <link rel="stylesheet" href="results.css">
  </head>

    <main class="card">
      <p class="eyebrow">충북대학교 공지</p>
      <h1>공지 확인 결과</h1>
      <p id="summary" class="summary">홈페이지와 DB를 확인하고 있습니다...</p>
      <p id="meta" class="meta"></p>
      <ul id="notices" class="notices"></ul>
      <p class="footnote">새 공지는 상세 내용을 저장하고, 이미 저장된 공지는 최신 내용으로 갱신할 수 있습니다. 내용을 확인한 뒤 저장 버튼을 누르세요. 사이트 확인은 사용자가 버튼을 눌렀을 때만 실행됩니다.</p>

    <script src="results.js"></script>
